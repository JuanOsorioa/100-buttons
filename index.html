<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>100 Buttons</title>
</head>

<body>
    <h1>Categoría 1. Fundamentos y colores — básico</h1>
    <button class="btn-primary">Primario</button>
    <button class="btn-secondary">Secundario</button>
    <button class="btn-success">Éxito</button>
    <button class="btn-danger">Peligro</button>
    <button class="btn-warning">Advertencia</button>
    <button class="btn-info">Información</button>
    <button class="btn-dark">Oscuro</button>
    <button class="btn-light">Claro</button>
    <button class="btn-text">Texto</button>
    <button class="btn-custom">Personalizado</button>

    <h2>Categoría 2. Bordes, tamaños y formas -- Básico</h2>
    <button class="btn-outline">Contorno</button>
    <button class="btn-border-thick">Borde grueso</button>
    <button class="btn-border-dashed">Borde discontinuo</button>
    <button class="btn-border-dotted">Borde punteado</button>
    <button class="btn-rounded">Esquinas redondeadas</button>
    <button class="btn-pill">Píldora</button>
    <button class="btn-circle" aria-label="Agregar">+</button>
    <button class="btn-small">Pequeño</button>
    <button class="btn-large">Grande</button>
    <button class="btn-full">Ancho completo</button>
</body>

</html>
